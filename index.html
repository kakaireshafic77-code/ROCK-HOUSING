<style>

    radial-gradient(circle at 12% 10%, rgba(74,95,232,.14) 0%, transparent 42%),

    padding: 20px; }

.auth-logo { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--purple)); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; color: #fff; box-shadow: 0 8px 24px rgba(74,95,232,.35); }
.auth-card h1 { font-size: 24px; margin-bottom: 6px; }
.auth-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 26px; }

.auth-toggle button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.brand h1 { font-size: 19px; }
.header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.tabbar::-webkit-scrollbar { display: none; }
.tabbar button { color: var(--text-muted); padding: 10px 18px; border-radius: var(--radius-pill); font-weight: 600; font-size: 13.5px; white-space: nowrap; display: flex; align-items: center; gap: 7px; flex-shrink: 0; transition: all .15s; }
.tabbar button.active { background: var(--surface); color: var(--blue); box-shadow: var(--shadow-sm); }
.tabbar button:hover:not(.active) { color: var(--text); }

main { flex: 1; max-width: 1180px; width: 100%; margin: 0 auto; padding: 22px 24px 90px; }
.view { animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.stat-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--blue); }
.stat-card.accent-green::before { background: var(--green); }
.stat-card.accent-red::before { background: var(--red); }
.stat-card.accent-orange::before { background: var(--orange); }
.stat-card.accent-purple::before { background: var(--purple); }
.stat-card.accent-teal::before { background: var(--teal); }
.stat-card.accent-pink::before { background: var(--pink); }
.stat-card.accent-yellow::before { background: var(--yellow); }
.stat-card .row { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); }
.stat-card .row span { font-size: 13.5px; font-weight: 600; color: var(--text); }
.stat-card .icon-chip { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--blue-bg); color: var(--blue); }
.stat-card.accent-green .icon-chip { background: var(--green-bg); color: var(--green); }
.stat-card.accent-red .icon-chip { background: var(--red-bg); color: var(--red); }
.stat-card.accent-orange .icon-chip { background: var(--orange-bg); color: var(--orange); }
.stat-card.accent-purple .icon-chip { background: var(--purple-bg); color: var(--purple); }
.stat-card.accent-teal .icon-chip { background: var(--teal-bg); color: var(--teal); }
.stat-card.accent-pink .icon-chip { background: var(--pink-bg); color: var(--pink); }
.stat-card.accent-yellow .icon-chip { background: var(--yellow-bg); color: var(--yellow); }
.stat-card .val { font-size: 26px; font-weight: 700; margin-top: 14px; font-family: var(--font-display); word-break: break-word; }
.stat-card .sub { font-size: 12.5px; color: var(--text-faint); margin-top: 3px; }
.stat-card .val.danger { color: var(--red); }
.stat-card .val.success { color: var(--green); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media(max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.panel-head h3 { font-size: 14.5px; }
.panel-head svg { color: var(--blue); }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; transition: all .15s; display: flex; flex-direction: column; }

.item-card .ic-sku { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
.item-card .ic-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--text-muted); gap: 8px; }

.item-card .ic-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 14px; flex-wrap: wrap; }
.item-card .ic-actions .btn { flex: 1; min-width: 90px; }

.filter-chips { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 700; background: var(--surface); border: 1.5px solid var(--border-strong); color: var(--text-muted); transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
.filter-chip:hover { border-color: var(--text-muted); }
.filter-chip.active { background: var(--black); color: #fff; border-color: var(--black); }
.filter-chip .count { background: rgba(0,0,0,.08); padding: 1px 7px; border-radius: 999px; font-size: 11px; }
.filter-chip.active .count { background: rgba(255,255,255,.2); }
.filter-chip.chip-done.active { background: var(--green); border-color: var(--green); }
.filter-chip.chip-pending.active { background: #B45309; border-color: #B45309; }
.filter-chip.chip-progress.active { background: var(--yellow); border-color: var(--yellow); color: #fff; }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.table-wrap thead th { background: var(--surface-muted); color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: .8px; }
.table-wrap tbody tr:hover { background: var(--surface-muted-2); }

.overlay { position: fixed; inset: 0; background: rgba(12,12,16,.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; backdrop-filter: blur(4px); }
.modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 480px; padding: 26px; max-height: 88vh; overflow: auto; box-shadow: var(--shadow-lg); animation: modalIn .2s ease; }
@keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal h3 { font-size: 17px; margin-bottom: 18px; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions .btn { flex: 1; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.footnote { max-width: 1180px; margin: 0 auto; padding: 0 24px 24px; color: var(--text-faint); font-size: 11px; text-align: center; }
.bar { height: 6px; background: var(--surface-muted); border-radius: 6px; overflow: hidden; margin-top: 5px; }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--green), var(--teal)); transition: width .4s ease; }

@media(max-width: 640px) {
    .tabbar button span { display: none; }
    main { padding: 16px 14px 90px; }

    .grid-2 { gap: 12px; }

    .auth-row { grid-template-columns: 1fr; }

    .stat-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .app-header { padding: 10px 14px; }
    .brand h1 { font-size: 16px; }
    .header-right { gap: 8px; }
    .tabbar-wrap { padding: 12px 14px 0; }
    .user-chip .name { display: none; }
    .view-head h2 { font-size: 20px; }
    .stat-card .val { font-size: 22px; }
}
@media(max-width: 480px) { .card-grid { grid-template-columns: 1fr; } }
</style>

let db = null;

function load() {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) { db = seedData(); localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
    else { try { db = JSON.parse(raw); } catch { db = seedData(); } }
    if (!db.tenantPayments) db.tenantPayments = [];
    if (!db.tenantTickets) db.tenantTickets = [];
}
function persist() { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function nowISO() { return new Date().toISOString(); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function monthKey(d) { return (d || todayISO()).slice(0,7); }

function insert(table, record) {
    if (!db[table]) db[table] = [];
    record.id = record.id || genId();
    record.createdAt = record.createdAt || nowISO();
    record.updatedAt = nowISO();
    db[table].push(record);
    persist();
    return record;
}
function updateRecord(table, id, updates) {
    const arr = db[table] || [];
    const idx = arr.findIndex(r => r.id === id);
    if (idx === -1) return null;
    arr[idx] = { ...arr[idx], ...updates, updatedAt: nowISO() };
    persist();
    return arr[idx];
}
function delRecord(table, id) {
    if (!db[table]) return false;
    db[table] = db[table].filter(r => r.id !== id);
    persist();
    return true;
}
function findById(table, id) { return (db[table] || []).find(r => r.id === id) || null; }
function byLandlord(table, landlordId) {
    if (!landlordId) return [];
    return (db[table] || []).filter(r => r.landlordId === landlordId);
}

function getSession() {
    if (session) return session;
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY)); return session; } catch { return null; }
}
function setSession(data) { session = data; localStorage.setItem(SESSION_KEY, JSON.stringify(data)); }
function clearSession() { session = null; localStorage.removeItem(SESSION_KEY); }
function isSuperAdmin() { const s = getSession(); return s && s.role === 'super_admin'; }
function getLandlordId() { const s = getSession(); return s ? s.landlordId : null; }
function getCurrentLandlord() {
    const id = getLandlordId();
    if (!id) return null;
    return (db.landlords || []).find(l => l.id === id) || null;
}
function logActivity(userId, landlordId, action, details) {
    if (!db.activityLogs) db.activityLogs = [];
    db.activityLogs.unshift({ id: genId(), landlordId, userId, action, details, timestamp: Date.now() });
    db.activityLogs = db.activityLogs.slice(0, 500);
    persist();
}

function registerLandlord(data) {
    const { landlordName, ownerName, contact, email, username, password, avatar } = data;
    if (db.landlords.find(l => l.name.toLowerCase() === landlordName.toLowerCase())) {
        return { success: false, error: 'That landlord name already exists' };
    }
    if (db.users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
        return { success: false, error: 'That username is already taken' };
    }
    const landlord = { id: genId(), name: landlordName, ownerName, contact, email: email || '', status: 'active', createdAt: Date.now() };
    db.landlords.push(landlord);
    const user = { id: genId(), landlordId: landlord.id, username: username.toLowerCase(), password, name: ownerName, role: 'owner', phone: contact, avatar: avatar || null, createdAt: Date.now() };
    db.users.push(user);
    logActivity(user.id, landlord.id, 'register', `Landlord "${landlordName}" registered`);
    persist();
    return { success: true, landlord, user };
}

function login(landlordName, username, password) {
    if (username.trim().toLowerCase() === SUPER_ADMIN.username.toLowerCase()
        && password === SUPER_ADMIN.password) {
        const s = { userId: 'super_admin', landlordId: null, username: SUPER_ADMIN.name, role: 'super_admin', name: SUPER_ADMIN.name };
        setSession(s);
        return { success: true, session: s };
    }
    const landlord = db.landlords.find(l => l.name.toLowerCase() === landlordName.trim().toLowerCase());
    if (!landlord) return { success: false, error: 'Landlord account not found.' };
    const user = db.users.find(u =>
        u.landlordId === landlord.id &&
        u.username.toLowerCase() === username.trim().toLowerCase() &&
        u.password === password
    );
    if (!user) return { success: false, error: 'Invalid username or password' };
    const s = { userId: user.id, landlordId: landlord.id, username: user.name, role: user.role, name: user.name };
    setSession(s);
    logActivity(user.id, landlord.id, 'login', `${user.name} logged in`);
    return { success: true, session: s };
}

function logout() {
    clearSession();
}

function fmt(n) {
    const cur = (db && db.currency) || 'UGX';
    return cur + ' ' + Number(n || 0).toLocaleString('en-UG');
}
function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    if (s < 604800) return Math.floor(s/86400) + 'd ago';
    return Math.floor(s/604800) + 'w ago';
}
function toast(msg, type) {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' toast-' + type : '');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2600);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function monthsElapsed(startISO) {
    if (!startISO) return 0;
    const s = new Date(startISO), n = new Date();
    let m = (n.getFullYear()-s.getFullYear())*12 + (n.getMonth()-s.getMonth());
    return Math.max(m + 1, 1);
}
function calcArrears(tenant) {
    const expected = Number(tenant.rent) * monthsElapsed(tenant.leaseStart);
    const adminPaid = (db.payments || []).filter(p => p.tenantId === tenant.id).reduce((s,p)=>s+Number(p.amount),0);
    const portalPaid = (db.tenantPayments || []).filter(p => p.tenantId === tenant.id).reduce((s,p)=>s+Number(p.amount),0);
    const paid = adminPaid + portalPaid;
    return { expected, paid, arrears: Math.max(expected - paid, 0) };
}

function getTenant(id) { return findById('tenants', id); }
function getProperty(id) { return findById('properties', id); }
function tenantOfUnit(unitId) {

}

function buildTenantLink(tenantId) {
    const base = location.origin + location.pathname.replace(/[^/]*$/, '');
    return base + 'tenant.html?tenant=' + encodeURIComponent(tenantId);
}
function copyTenantLink(tenantId) {
    const url = buildTenantLink(tenantId);
    navigator.clipboard.writeText(url).then(() => {
        toast('Tenant portal link copied');
    }).catch(() => {
        prompt('Copy this link:', url);
    });
}

/* Open portal in new tab */
function openTenantPortal(tenantId) {
    const url = buildTenantLink(tenantId);
    window.open(url, '_blank');
}

function bindAuth() {
    document.querySelectorAll('.auth-toggle button').forEach(btn => {
        btn.onclick = () => { authMode = btn.dataset.mode; authError = ''; render(); };
    });
    if (authMode === 'register') {
        const pick = document.getElementById('regAvatarPick');
        if (pick) {
            pick.onclick = () => document.getElementById('regAvatarFile').click();
            document.getElementById('regAvatarFile').onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    pendingAvatar = reader.result;
                    document.getElementById('regAvatarPreview').innerHTML = `<img src="${pendingAvatar}">`;
                };
                reader.readAsDataURL(file);
            };
        }
    }
    const loginBtn = document.getElementById('loginBtn');
    if (loginBtn) {
        loginBtn.onclick = () => {
            const shopName = document.getElementById('loginShop').value.trim();
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value;
            if (!shopName || !username || !password) { authError = 'Please fill in all fields'; render(); return; }
            const r = login(shopName, username, password);
            if (r.success) {
                authError = '';
                if (r.session.role === 'super_admin') adminTab = 'overview';
                else activeTab = 'dashboard';
                render();
                toast('Welcome, ' + r.session.name);
            } else { authError = r.error; render(); }
        };
        document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });
    }
    const regBtn = document.getElementById('registerBtn');
    if (regBtn) {
        regBtn.onclick = () => {
            const landlordName = document.getElementById('regShop').value.trim();
            const ownerName = document.getElementById('regOwner').value.trim();
            const contact = document.getElementById('regContact').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPass').value;
            if (!landlordName || !ownerName || !contact || !username || !password) { authError = 'Please fill in all required fields'; render(); return; }
            if (password.length < 4) { authError = 'Password must be at least 4 characters'; render(); return; }
            if (username.toLowerCase() === SUPER_ADMIN.username.toLowerCase()) { authError = 'That username is reserved'; render(); return; }
            const r = registerLandlord({ landlordName, ownerName, contact, email, username, password, avatar: pendingAvatar });
            if (r.success) {
                const s = { userId: r.user.id, landlordId: r.landlord.id, username: r.user.name, role: 'owner', name: r.user.name };
                setSession(s);
                pendingAvatar = null; authError = ''; activeTab = 'dashboard';
                render(); toast('Account created');
            } else { authError = r.error; render(); }
        };
    }
}

    if (lo) lo.onclick = () => { logout(); activeTab = 'dashboard'; adminTab = 'overview'; render(); toast('Logged out'); };
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { activeTab = b.dataset.tab; render(); });
    document.querySelectorAll('[data-admin-tab]').forEach(b => b.onclick = () => { adminTab = b.dataset.adminTab; render(); });
    const brand = document.getElementById('brandBtn');
    if (brand) brand.onclick = () => { if (!isSuperAdmin()) openBrandingModal(); };
    const prof = document.getElementById('profileBtn');
    if (prof) prof.onclick = () => { if (!isSuperAdmin()) openProfileModal(); };
    const inst = document.getElementById('installBtn');
    if (deferredInstallPrompt && inst) inst.style.display = 'inline-flex';
    if (inst) inst.onclick = async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        inst.style.display = 'none';
    };
}

    const expenses = byLandlord('expenses', lid);

    const occupied = units.filter(u => u.status === 'occupied').length;

        <div class="stat-card accent-red"><div class="row"><span>Arrears</span><span class="icon-chip">${I('alert',16)}</span></div><div class="val ${totalArrears>0?'danger':'success'}">${fmt(totalArrears)}</div><div class="sub">outstanding rent</div></div>

    <div class="grid-2">
        <div class="panel">
            <div class="panel-head">${I('dollar',17)}<h3>Recent Payments</h3></div>

/* ================================================================
   MAINTENANCE — unified with stats + 3 explicit buttons
   ================================================================ */
function MaintenanceView() {
    const lid = getLandlordId();
    const fs = searchState.maintStatus || 'all';

    /* Unify admin + portal tickets */
    const adminMaint = byLandlord('maintenance', lid).map(m => ({ ...m, source: 'admin' }));
    const portalTickets = byLandlord('tenantTickets', lid).map(t => ({
        id: t.id,
        landlordId: t.landlordId,
        unitId: t.unitId,
        issue: t.issue,
        reportedBy: t.tenantName || 'Tenant',
        priority: 'Medium',
        cost: 0,
        status: t.status === 'Open' ? 'pending'
              : t.status === 'In Progress' ? 'progress'
              : t.status === 'Resolved' ? 'done'
              : 'done',
        tenantConfirmed: t.tenantConfirmed || false,
        tenantResolved: t.tenantResolved || false,
        date: t.date,
        source: 'portal'
    }));

    const all = [...adminMaint, ...portalTickets].sort((a,b) => (b.date||'').localeCompare(a.date||''));

    /* Counts */
    const counts = {
        all: all.length,
        pending: all.filter(m => m.status === 'pending').length,
        progress: all.filter(m => m.status === 'progress').length,
        done: all.filter(m => m.status === 'done').length
    };

    /* Filter */
    const list = fs === 'all' ? all : all.filter(m => m.status === fs);

    const badge = s => s === 'pending' ? 'badge-pending' : s === 'progress' ? 'badge-progress' : 'badge-done';

    return `
    <div class="view-head">
        <div><h2>Maintenance</h2><p>${all.length} request${all.length===1?'':'s'} (includes tenant portal tickets)</p></div>
        <button class="btn btn-black" id="addMaintBtn">${I('plus',15)} Log Request</button>
    </div>

    <div class="filter-chips">
        <button class="filter-chip ${fs==='all'?'active':''}" data-maint-filter="all">All <span class="count">${counts.all}</span></button>
        <button class="filter-chip chip-pending ${fs==='pending'?'active':''}" data-maint-filter="pending">Pending <span class="count">${counts.pending}</span></button>
        <button class="filter-chip chip-progress ${fs==='progress'?'active':''}" data-maint-filter="progress">In Progress <span class="count">${counts.progress}</span></button>
        <button class="filter-chip chip-done ${fs==='done'?'active':''}" data-maint-filter="done">Done <span class="count">${counts.done}</span></button>
    </div>

    <div class="card-grid">
        ${list.length ? list.map(m => {
            const u = getUnit(m.unitId);
            const p = u ? getProperty(u.propertyId) : null;
            const portalTag = m.source === 'portal' ? '<span class="badge badge-pink">Portal</span>' : '';
            const confirmTag = m.tenantConfirmed ? '<span class="badge badge-green">Tenant Confirmed</span>' : '';
            return `
            <div class="item-card">
                <div class="ic-top">
                    <div class="ic-name">${esc(m.issue)}</div>
                    <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">${portalTag}<span class="badge ${badge(m.status)}">${esc(m.status)}</span></div>
                </div>
                <div class="ic-sku">${esc(p?p.name:'—')}${u?' / '+esc(u.name):''} · ${esc(m.date||'')}</div>
                ${confirmTag ? `<div style="margin-top:8px;">${confirmTag}</div>` : ''}
                <div class="ic-row"><span>Reported by:</span><b>${esc(m.reportedBy||'—')}</b></div>
                <div class="ic-row"><span>Priority:</span><b>${esc(m.priority||'Medium')}</b></div>
                <div class="ic-row"><span>Cost:</span><b>${fmt(m.cost||0)}</b></div>
                <div class="ic-actions">
                    <button class="btn btn-outline btn-sm" data-setstatus="pending" data-maint-id="${m.id}" data-maint-src="${m.source}">Pending</button>
                    <button class="btn btn-warn btn-sm" data-setstatus="progress" data-maint-id="${m.id}" data-maint-src="${m.source}">In Progress</button>
                    <button class="btn btn-success btn-sm" data-setstatus="done" data-maint-id="${m.id}" data-maint-src="${m.source}">Done</button>
                    <button class="btn btn-danger btn-sm" data-delmaint="${m.id}" data-maint-src="${m.source}">${I('trash',14)}</button>
                </div>
            </div>`;
        }).join('') : `<div class="empty" style="grid-column:1/-1"><b>No maintenance requests</b>Log repairs or wait for tenant submissions.</div>`}
    </div>`;
}

/* ================================================================
   REPORTS
   ================================================================ */
function ReportsView() {
    const lid = getLandlordId();
    const payments = [...byLandlord('payments', lid), ...byLandlord('tenantPayments', lid)];
    const expenses = byLandlord('expenses', lid);
    const maintenance = byLandlord('maintenance', lid);
    const units = byLandlord('units', lid);
    const tenants = byLandlord('tenants', lid).filter(t => t.status === 'active');

    const collected = payments.filter(p => monthKey(p.date) === monthKey()).reduce((s,p)=>s+Number(p.amount),0);
    const expensesMTD = expenses.filter(e => monthKey(e.date) === monthKey()).reduce((s,e)=>s+Number(e.amount),0);
    const maintMTD = maintenance.filter(m => monthKey(m.date) === monthKey()).reduce((s,m)=>s+Number(m.cost||0),0);
    const net = collected - expensesMTD - maintMTD;
    const totalArrears = tenants.reduce((s,t)=>s+calcArrears(t).arrears, 0);
    const occupied = units.filter(u=>u.status==='occupied').length;
    const occRate = units.length ? Math.round(occupied/units.length*100) : 0;

    return `
    <div class="view-head">
        <div><h2>Reports</h2><p>Business insights — this month</p></div>
        <button class="btn btn-outline btn-sm" id="exportAllBtn">${I('download',15)} Export CSV</button>
    </div>
    <div class="stat-grid">
        <div class="stat-card accent-green"><div class="row"><span>Collected</span><span class="icon-chip">${I('dollar',16)}</span></div><div class="val success">${fmt(collected)}</div><div class="sub">this month</div></div>
        <div class="stat-card accent-red"><div class="row"><span>Expenses</span><span class="icon-chip">${I('receipt',16)}</span></div><div class="val">${fmt(expensesMTD)}</div><div class="sub">this month</div></div>
        <div class="stat-card accent-yellow"><div class="row"><span>Maintenance</span><span class="icon-chip">${I('wrench',16)}</span></div><div class="val">${fmt(maintMTD)}</div><div class="sub">this month</div></div>
        <div class="stat-card accent-purple"><div class="row"><span>Net Income</span><span class="icon-chip">${I('trend',16)}</span></div><div class="val ${net>=0?'success':'danger'}">${fmt(net)}</div><div class="sub">${net>=0?'Profitable':'At loss'}</div></div>
        <div class="stat-card accent-orange"><div class="row"><span>Arrears</span><span class="icon-chip">${I('alert',16)}</span></div><div class="val ${totalArrears>0?'danger':'success'}">${fmt(totalArrears)}</div><div class="sub">outstanding</div></div>
        <div class="stat-card accent-teal"><div class="row"><span>Occupancy</span><span class="icon-chip">${I('building',16)}</span></div><div class="val">${occRate}%</div><div class="sub">${occupied}/${units.length}</div></div>
    </div>
    <div class="panel">
        <div class="panel-head">${I('building',17)}<h3>Property Performance</h3></div>
        <p class="panel-sub">Income and occupancy per property</p>
        ${byLandlord('properties', lid).length ? byLandlord('properties', lid).map(p => {
            const u = units.filter(x => x.propertyId === p.id);
            const occ = u.filter(x => x.status === 'occupied').length;
            const income = payments.filter(pay => {
                const t = getTenant(pay.tenantId);
                const un = t ? getUnit(t.unitId) : null;
                return un && un.propertyId === p.id;
            }).reduce((s,pay)=>s+Number(pay.amount),0);
            return `<div class="list-row">
                <div><div class="l-name">${esc(p.name)}</div><div class="l-sub">${occ}/${u.length} units occupied</div></div>
                <div class="l-val" style="color:var(--green);">${fmt(income)}</div>
            </div>`;
        }).join('') : '<div class="empty">No properties yet.</div>'}
    </div>`;
}

/* ================================================================

function bindTab() {
    if (activeTab === 'properties') {
        const inp = document.getElementById('propSearch');
        if (inp) inp.addEventListener('input', e => { searchState.props = e.target.value; renderInPlace(); });
        const addBtn = document.getElementById('addPropBtn');
        if (addBtn) addBtn.onclick = () => openPropertyModal(null);
        document.querySelectorAll('[data-editprop]').forEach(b => b.onclick = () => openPropertyModal(findById('properties', b.dataset.editprop)));
        document.querySelectorAll('[data-delprop]').forEach(b => b.onclick = () => {
            if (confirm('Delete this property?')) {
                delRecord('properties', b.dataset.delprop);
                db.units.forEach(u => { if (u.propertyId === b.dataset.delprop) u.propertyId = null; });
                persist(); toast('Property deleted'); render();
            }
        });
    }
    if (activeTab === 'units') {
        const fp = document.getElementById('filterUnitProp');
        if (fp) fp.onchange = e => { searchState.unitProp = e.target.value; renderInPlace(); };
        const fs = document.getElementById('filterUnitStatus');
        if (fs) fs.onchange = e => { searchState.unitStatus = e.target.value; renderInPlace(); };
        const addBtn = document.getElementById('addUnitBtn');
        if (addBtn) addBtn.onclick = () => openUnitModal(null);
        document.querySelectorAll('[data-editunit]').forEach(b => b.onclick = () => openUnitModal(findById('units', b.dataset.editunit)));
        document.querySelectorAll('[data-delunit]').forEach(b => b.onclick = () => {
            if (confirm('Delete this unit?')) {
                delRecord('units', b.dataset.delunit);
                db.tenants.forEach(t => { if (t.unitId === b.dataset.delunit) t.unitId = null; });
                persist(); toast('Unit deleted'); render();
            }
        });
    }
    if (activeTab === 'tenants') {
        const inp = document.getElementById('tenantSearch');
        if (inp) inp.addEventListener('input', e => { searchState.tenants = e.target.value; renderInPlace(); });
        const fs = document.getElementById('filterTenantStatus');
        if (fs) fs.onchange = e => { searchState.tenantStatus = e.target.value; renderInPlace(); };
        const addBtn = document.getElementById('addTenantBtn');
        if (addBtn) addBtn.onclick = () => openTenantModal(null);
        document.querySelectorAll('[data-edittenant]').forEach(b => b.onclick = () => openTenantModal(findById('tenants', b.dataset.edittenant)));
        document.querySelectorAll('[data-deltenant]').forEach(b => b.onclick = () => {
            if (confirm('Delete this tenant? Their portal link will stop working.')) {
                delRecord('tenants', b.dataset.deltenant);
                toast('Tenant deleted'); render();
            }
        });
        document.querySelectorAll('[data-paytenant]').forEach(b => b.onclick = () => openPaymentModal(null, b.dataset.paytenant));
        document.querySelectorAll('[data-copylink]').forEach(b => b.onclick = () => copyTenantLink(b.dataset.copylink));
        document.querySelectorAll('[data-openportal]').forEach(b => b.onclick = () => openTenantPortal(b.dataset.openportal));
    }
    if (activeTab === 'payments') {
        const inp = document.getElementById('paymentSearch');
        if (inp) inp.addEventListener('input', e => { searchState.payments = e.target.value; renderInPlace(); });
        const fm = document.getElementById('filterPayMonth');
        if (fm) fm.onchange = e => { searchState.payMonth = e.target.value; renderInPlace(); };
        const addBtn = document.getElementById('addPaymentBtn');
        if (addBtn) addBtn.onclick = () => openPaymentModal(null, null);
        document.querySelectorAll('[data-delpay]').forEach(b => b.onclick = () => {
            if (confirm('Delete this payment record?')) {
                delRecord('payments', b.dataset.delpay);
                toast('Payment deleted'); render();
            }
        });
        document.querySelectorAll('[data-printpay]').forEach(b => b.onclick = () => printPaymentReceipt(b.dataset.printpay));
    }
    if (activeTab === 'arrears') {
        document.querySelectorAll('[data-paytenant]').forEach(b => b.onclick = () => openPaymentModal(null, b.dataset.paytenant));
    }
    if (activeTab === 'maintenance') {
        document.querySelectorAll('[data-maint-filter]').forEach(b => b.onclick = () => {
            searchState.maintStatus = b.dataset.maintFilter;
            renderInPlace();
        });
        const addBtn = document.getElementById('addMaintBtn');
        if (addBtn) addBtn.onclick = () => openMaintenanceModal(null);
        /* Explicit status buttons */
        document.querySelectorAll('[data-setstatus]').forEach(b => b.onclick = () => {
            const newStatus = b.dataset.setstatus;
            const id = b.dataset.maintId;
            const src = b.dataset.maintSrc;
            if (src === 'portal') {
                const t = findById('tenantTickets', id);
                if (!t) return;
                t.status = newStatus === 'pending' ? 'Open'
                          : newStatus === 'progress' ? 'In Progress'
                          : 'Done';
                persist();
                toast('Ticket status: ' + t.status);
            } else {
                const m = findById('maintenance', id);
                if (!m) return;
                m.status = newStatus;
                m.updatedAt = nowISO();
                persist();
                toast('Status: ' + newStatus);
            }
            renderInPlace();
        });
        document.querySelectorAll('[data-delmaint]').forEach(b => b.onclick = () => {
            if (!confirm('Delete this maintenance request?')) return;
            if (b.dataset.maintSrc === 'portal') delRecord('tenantTickets', b.dataset.delmaint);
            else delRecord('maintenance', b.dataset.delmaint);
            toast('Deleted'); render();
        });
    }
    if (activeTab === 'expenses') {
        const addBtn = document.getElementById('addExpBtn');
        if (addBtn) addBtn.onclick = () => openExpenseModal(null);
        document.querySelectorAll('[data-delexp]').forEach(b => b.onclick = () => {
            if (confirm('Delete this expense?')) {
                delRecord('expenses', b.dataset.delexp);
                toast('Deleted'); render();
            }
        });
    }
    if (activeTab === 'staff') {
        const addBtn = document.getElementById('addStaffBtn');
        if (addBtn) addBtn.onclick = () => openStaffModal(null);
        document.querySelectorAll('[data-delstaff]').forEach(b => b.onclick = () => {
            if (confirm('Delete this staff member?')) {
                delRecord('staff', b.dataset.delstaff);
                toast('Deleted'); render();
            }
        });
    }
    if (activeTab === 'reports') {
        const exp = document.getElementById('exportAllBtn');
        if (exp) exp.onclick = exportAllCSV;
    }
}

/* ================================================================

   ================================================================ */
function showModal(html, id, onSave) {
    const root = document.getElementById('modalRoot') || (() => {
        const d = document.createElement('div'); d.id = 'modalRoot'; document.body.appendChild(d); return d;
    })();
    root.innerHTML = `<div class="overlay" id="ov${id}"><div class="modal">${html}</div></div>`;
    const ov = document.getElementById(`ov${id}`);
    ov.onclick = e => { if (e.target.id === `ov${id}`) closeModal(); };
    const cancel = document.getElementById('cancelModal');
    if (cancel) cancel.onclick = closeModal;
    const saveBtn = document.getElementById('saveBtn');
    if (saveBtn && onSave) saveBtn.addEventListener('click', onSave);
}
function closeModal() { const root = document.getElementById('modalRoot'); if (root) root.innerHTML = ''; }
function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

/* Payment modal — asks WHICH MONTH */
function openPaymentModal(edit, presetTenantId) {
    const lid = getLandlordId();
    const tenants = byLandlord('tenants', lid).filter(t => t.status === 'active');
    if (!tenants.length) { toast('Add a tenant first','error'); return; }
    const sel = presetTenantId || tenants[0].id;
    const t = getTenant(sel);
    const { arrears } = t ? calcArrears(t) : { arrears: 0 };
    const currentYear = new Date().getFullYear();
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const defaultMonth = new Date().getMonth() + 1;

    showModal(`
        <h3>Record Payment</h3>
        <div class="field"><label>Tenant</label><select id="fTenantId">${tenants.map(x => `<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.name)} (${fmt(calcArrears(x).arrears)} due)</option>`).join('')}</select></div>
        <div class="field"><label>Which month is this rent for? <span class="field-required">*</span></label>
            <div class="two-col">
                <select id="fMonth">${monthNames.map((m,i) => `<option value="${i+1}" ${defaultMonth===i+1?'selected':''}>${m}</option>`).join('')}</select>
                <select id="fYear">${[currentYear-1, currentYear, currentYear+1].map(y => `<option value="${y}" ${y===currentYear?'selected':''}>${y}</option>`).join('')}</select>
            </div>
        </div>
        <div class="two-col">
            <div class="field"><label>Amount <span class="field-required">*</span></label><input id="fAmount" type="number" value="${arrears>0?arrears:''}" placeholder="0"></div>
            <div class="field"><label>Date</label><input id="fDate" type="date" value="${todayISO()}"></div>
        </div>
        <div class="two-col">
            <div class="field"><label>Method</label><select id="fMethod"><option>Cash</option><option>Mobile Money</option><option>Bank Transfer</option><option>Cheque</option></select></div>
            <div class="field"><label>Receipt No.</label><input id="fReceipt" type="text" placeholder="Optional"></div>
        </div>
        <div class="modal-actions"><button class="btn btn-outline" id="cancelModal">Cancel</button><button class="btn btn-black" id="saveBtn">Save Payment</button></div>
    `, 'paymentModal', () => {
        const tenantId = val('fTenantId');
        const amount = Number(val('fAmount'));
        const month = Number(val('fMonth'));
        const year = Number(val('fYear'));
        if (!tenantId || !amount) { toast('Tenant and amount required','error'); return; }
        insert('payments', {
            landlordId: lid, tenantId, amount,
            date: val('fDate') || todayISO(),
            method: val('fMethod'),
            month, year,
            monthName: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][month-1],
            period: year + '-' + String(month).padStart(2,'0'),
            receipt: val('fReceipt'),
            source: 'admin'
        });
        const t = getTenant(tenantId);
        logActivity(getSession().userId, lid, 'add_payment', `Payment ${fmt(amount)} from ${t?t.name:'—'} for ${month}/${year}`);
        closeModal(); render(); toast('Payment recorded');
    });
}

function exportAllCSV() {
    const lid = getLandlordId();
    const sections = [];
    const toCSV = (title, rows) => {
        if (!rows.length) return `${title}\n(no records)`;
        const keys = Object.keys(rows[0]);
        return `${title}\n${keys.join(',')}\n` + rows.map(r => keys.map(k => `"${String(r[k]??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    };
    sections.push(toCSV('PROPERTIES', byLandlord('properties', lid)));
    sections.push(toCSV('UNITS', byLandlord('units', lid)));
    sections.push(toCSV('TENANTS', byLandlord('tenants', lid)));
    sections.push(toCSV('ADMIN PAYMENTS', byLandlord('payments', lid)));
    sections.push(toCSV('PORTAL PAYMENTS', byLandlord('tenantPayments', lid)));
    sections.push(toCSV('MAINTENANCE', byLandlord('maintenance', lid)));
    sections.push(toCSV('PORTAL TICKETS', byLandlord('tenantTickets', lid)));
    sections.push(toCSV('EXPENSES', byLandlord('expenses', lid)));
    sections.push(toCSV('STAFF', byLandlord('staff', lid)));
    const blob = new Blob([sections.join('\n\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rock_housings_export_${todayISO()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Exported');
}

let deferredInstallPrompt = null;
function setupPWA() {
    const iconSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230C0C10'/%3E%3Ctext x='50' y='62' font-family='Arial' font-size='38' font-weight='900' fill='%23fff' text-anchor='middle'%3ERH%3C/text%3E%3C/svg%3E";
    const manifest = {
        name: 'ROCK HOUSINGS', short_name: 'ROCK HOUSINGS',
        start_url: '.', display: 'standalone',
        background_color: '#EEF1F7', theme_color: '#0C0C10',
        icons: [{ src: iconSvg, sizes: '192x192', type: 'image/svg+xml' }, { src: iconSvg, sizes: '512x512', type: 'image/svg+xml' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.getElementById('pwa-manifest');
    if (link) link.setAttribute('href', URL.createObjectURL(blob));
    if ('serviceWorker' in navigator) {
        const sw = `const C='rock-housings-v1';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.add(self.registration.scope)));self.skipWaiting();});self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{const cl=r.clone();caches.open(C).then(x=>x.put(e.request,cl));return r;}).catch(()=>c)));});`;
        navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type:'application/javascript'}))).catch(()=>{});
    }
}
window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const btn = document.getElementById('installBtn');
    if (btn) btn.style.display = 'inline-flex';
});
